[project]
name = "votes"
version = "0.1.0"
description = ""
authors = [
    {name = "Nikita Okhotnikov",email = "nikiquark@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==6.0",
    "gunicorn==23.0.0",
    "python-dotenv (>=1.2.1,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "selenium (>=4.44.0,<5.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "votes.test_settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
